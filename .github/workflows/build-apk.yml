name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Stamp version (git commit count, shared with the Pages deploy)
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_NAME="1.0.$VERSION_CODE"
          echo "Stamping version $VERSION_NAME ($VERSION_CODE)"
          sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          cat > www/assets/build-version.js <<EOF
          window.APP_VERSION_CODE = $VERSION_CODE;
          window.APP_VERSION_NAME = "$VERSION_NAME";
          EOF

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mes-architect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: Auto-built debug APK from commit ${{ github.sha }}.
