name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify translations still match the current English content
        env:
          MES_BUNDLE_KEY: ${{ secrets.MES_BUNDLE_KEY }}
        run: node scripts/check-translation-sync.js

      - name: Stamp version (git commit count, shared with the Pages deploy)
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          BASE_MINOR=2
          MINOR=$(( BASE_MINOR + VERSION_CODE / 100 ))
          PATCH=$(( VERSION_CODE % 100 ))
          VERSION_NAME="1.$MINOR.$PATCH"
          echo "Stamping version $VERSION_NAME ($VERSION_CODE)"
          sed -i "s/versionCode [0-9]\+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          sed -i "s#const CACHE_NAME = '[^']*'#const CACHE_NAME = 'mes-architect-v$VERSION_CODE'#" www/sw.js
          node scripts/build-translation-manifest.js
          cat > www/assets/build-version.js <<EOF
          window.APP_VERSION_CODE = $VERSION_CODE;
          window.APP_VERSION_NAME = "$VERSION_NAME";
          EOF

      - name: Inject Groq API key (repo secret — never committed to source)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if grep -q "apiBase: 'https" www/assets/backend-config.js; then
            echo "Backend mode is on — the Groq key stays in the Worker, not the public bundle."
          elif [ -n "$GROQ_API_KEY" ]; then
            sed -i "s#__GROQ_API_KEY__#$GROQ_API_KEY#" www/assets/app.js
          else
            echo "::warning::GROQ_API_KEY secret not set — AI chat will show its 'not configured' message."
          fi

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Prepare release signing
        # Falls back to a debug build when no keystore secret is configured, so
        # this workflow keeps working before the signing secrets exist. Once
        # ANDROID_KEYSTORE_BASE64 is set, every build is store-ready.
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded — building a signed release APK."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — building a debug-signed APK. Every app store will reject it."
          fi

      - name: Build APK
        working-directory: android
        env:
          MES_KEYSTORE_FILE: release.jks
          MES_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MES_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MES_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            # The APK is for direct download; Google Play only accepts the AAB.
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Collect the APK under a branded, stable filename
        # Stable (no version number in the name) so version.json's apkUrl —
        # ".../releases/latest/download/MES-Architect.apk" — never changes
        # between builds; only the release it points to does.
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
            # Gradle silently emits app-release-unsigned.apk when the signing
            # config didn't apply, so the filename is the signing check.
            if [ ! -f "$SRC" ]; then
              echo "::error::No signed APK produced — check ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD."
              ls -la android/app/build/outputs/apk/release/ || true
              exit 1
            fi
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$SRC" MES-Architect.apk

      - name: Remove the decoded keystore
        if: always()
        run: rm -f android/release.jks

      - name: Upload Play Store bundle (AAB)
        # Workflow artifact only — not attached to the public release, since an
        # AAB can't be installed directly; download it here for Play Console.
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MES-Architect-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MES-Architect-apk
          path: MES-Architect.apk

      - name: Attach APK to a release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MES Architect — build ${{ github.run_number }}
          files: MES-Architect.apk
          body: ${{ steps.signing.outputs.signed == 'true' && 'Release-signed APK' || 'Debug-signed APK (no release key configured) — app stores will reject this' }} from commit ${{ github.sha }}.
