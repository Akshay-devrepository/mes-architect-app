name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Write version.json + stamp the SW cache (same git-commit-count scheme as the APK build)
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          BASE_MINOR=2
          MINOR=$(( BASE_MINOR + VERSION_CODE / 100 ))
          PATCH=$(( VERSION_CODE % 100 ))
          VERSION_NAME="1.$MINOR.$PATCH"
          sed -i "s#const CACHE_NAME = '[^']*'#const CACHE_NAME = 'mes-architect-v$VERSION_CODE'#" www/sw.js
          node scripts/build-translation-manifest.js
          cat > www/version.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/MES-Architect.apk"
          }
          EOF

      - name: Inject Groq API key (repo secret — never committed to source)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if grep -q "apiBase: 'https" www/assets/backend-config.js; then
            echo "Backend mode is on — the Groq key stays in the Worker, not the public bundle."
          elif [ -n "$GROQ_API_KEY" ]; then
            sed -i "s#__GROQ_API_KEY__#$GROQ_API_KEY#" www/assets/app.js
          else
            echo "::warning::GROQ_API_KEY secret not set — AI chat will show its 'not configured' message."
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
