apply plugin: 'com.android.application'

// ── Release signing ─────────────────────────────────────────────────────
// Credentials come from android/keystore.properties locally, or MES_KEYSTORE_*
// environment variables in CI. Neither the keystore nor its passwords are ever
// committed. Paths in `storeFile` are relative to android/ (or absolute).
//
//   storeFile=release.jks
//   storePassword=...
//   keyAlias=mes-architect
//   keyPassword=...
//
// When nothing is configured, release builds stay UNSIGNED rather than failing
// the build — a fresh clone with no secrets can still run assembleDebug. CI
// checks for the signed artifact by name, so a misconfigured key can't silently
// ship an unsigned APK to a store.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseStoreFile = keystoreProps['storeFile'] ?: System.getenv('MES_KEYSTORE_FILE')
def releaseStorePassword = keystoreProps['storePassword'] ?: System.getenv('MES_KEYSTORE_PASSWORD')
def releaseKeyAlias = keystoreProps['keyAlias'] ?: System.getenv('MES_KEY_ALIAS')
def releaseKeyPassword = keystoreProps['keyPassword'] ?: System.getenv('MES_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile != null && rootProject.file(releaseStoreFile).exists()

android {
    namespace = "com.mesarchitect.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mesarchitect.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // A committed, stable debug keystore — without this, every CI run (a
    // fresh VM with no pre-existing ~/.android/debug.keystore) gets its own
    // auto-generated, differently-signed debug key, so Android refuses to
    // install any new build over the last one ("conflicts with an existing
    // package"). Same keystore every build = every build can update the last.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'PKCS12'
        }
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
